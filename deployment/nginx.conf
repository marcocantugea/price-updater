server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular emits content-hashed files (`outputHashing: all`), so a bundle can
    # be cached forever: a new build always produces a new name.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell must be revalidated on every navigation, or a stale index.html
    # would keep pointing at bundles a deployment has already replaced.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page application: unknown paths render the shell and let the
    # Angular router resolve them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
